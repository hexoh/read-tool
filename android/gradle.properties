org.gradle.jvmargs=-Xmx2560m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# 注意：这里不要写 org.gradle.java.home。
# 它是机器相关路径，提交后会让 CI（Linux）直接报错。
# 本机需要固定 JDK 21 时，写到用户级 ~/.gradle/gradle.properties：
#   org.gradle.java.home=/Library/Java/JavaVirtualMachines/jdk-21.jdk/Contents/Home
# CI 由 actions/setup-java 设置 JAVA_HOME，无需此配置。
